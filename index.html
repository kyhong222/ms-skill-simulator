    <!-- 다크 모드 깜빡임 방지: React가 뜨기 전에 <html>에 dark 클래스를 미리 단다.
         저장 키는 src/constants/colorMode.ts와 같아야 한다 -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("skillSimulator_colorMode") || "system";
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
